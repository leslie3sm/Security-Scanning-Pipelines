name: CycloneDX SBOM Validation and Conversion

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cyclonedx-sbom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OSV Scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install CycloneDX CLI
        run: |
          dotnet tool install --global CycloneDX.CLI
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          osv-scanner scan source -r . --format cyclonedx-1-5 > sbom/application.cdx.json

      - name: Validate SBOM
        run: |
          cyclonedx validate --input-file sbom/application.cdx.json

      - name: Convert SBOM JSON to XML
        run: |
          cyclonedx convert             --input-file sbom/application.cdx.json             --output-file sbom/application.cdx.xml             --output-format xml

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom/
