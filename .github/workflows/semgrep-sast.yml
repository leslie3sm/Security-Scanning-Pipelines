name: Semgrep SAST Scan

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-sast:
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan - SARIF
        run: |
          semgrep scan --config auto --sarif --output semgrep-results.sarif             .
        continue-on-error: true

      - name: Run Semgrep SAST scan - JSON
        run: |
          semgrep scan --config auto --json --output semgrep-results.json             .
        continue-on-error: true

      - name: Upload Semgrep SARIF to GitHub Code Scanning
        if: ${{ hashFiles('semgrep-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload Semgrep artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-reports
          path: |
            semgrep-results.sarif
            semgrep-results.json
          if-no-files-found: warn
