name: Bearer SAST and Privacy Scan

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  bearer-sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bearer CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sh
          echo "$HOME/.bearer/bin" >> $GITHUB_PATH

      - name: Run Bearer SAST scan
        run: |
          mkdir -p reports
          bearer scan . --format sarif --output reports/bearer-results.sarif
        continue-on-error: true

      - name: Upload Bearer SARIF to GitHub Code Scanning
        if: ${{ hashFiles('reports/bearer-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/bearer-results.sarif

      - name: Upload Bearer report
        uses: actions/upload-artifact@v4
        with:
          name: bearer-sast-report
          path: reports/
          if-no-files-found: warn
