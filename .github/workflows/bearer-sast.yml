name: Bearer SAST and Privacy Scan

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  bearer-sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bearer CLI
        run: |
          curl -sSL https://github.com/Bearer/bearer/releases/latest/download/bearer_linux_amd64.tar.gz -o /tmp/bearer.tar.gz
          tar -xzf /tmp/bearer.tar.gz -C /tmp
          sudo install -m 0755 /tmp/bearer /usr/local/bin/bearer
          /usr/local/bin/bearer --version

      - name: Run Bearer SAST scan
        run: |
          mkdir -p reports
          /usr/local/bin/bearer scan . --format sarif --output reports/bearer-results.sarif

      - name: Upload Bearer SARIF to GitHub Code Scanning
        if: ${{ hashFiles('reports/bearer-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/bearer-results.sarif

      - name: Upload Bearer report
        uses: actions/upload-artifact@v4
        with:
          name: bearer-sast-report
          path: reports/
          if-no-files-found: warn
