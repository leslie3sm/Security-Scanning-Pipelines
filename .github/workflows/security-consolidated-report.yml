name: Security Consolidated Excel Report

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-security-excel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download latest security artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          import zipfile

          urllib.request.urlparse = urllib.parse.urlparse

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          out_dir = pathlib.Path("collected")
          out_dir.mkdir(parents=True, exist_ok=True)

          expected = {
              "checkov-iac-report": "Checkov",
              "osv-security-reports": "OSV",
              "semgrep-sast-reports": "Semgrep",
              "trivy-security-reports": "Trivy",
              "cyclonedx-sbom": "CycloneDX",
          }

          class _StripAuthOnRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  new_req = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if new_req and "github.com" not in urllib.request.urlparse(newurl).netloc:
                      new_req.headers.pop("Authorization", None)
                      new_req.unredirected_hdrs.pop("Authorization", None)
                  return new_req

          _opener = urllib.request.build_opener(_StripAuthOnRedirect)

          def gh_get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with _opener.open(req) as response:
                  return json.load(response)

          artifacts = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}"
              payload = gh_get(url)
              items = payload.get("artifacts", [])
              if not items:
                  break
              artifacts.extend(items)
              if len(items) < 100:
                  break
              page += 1

          selected = {}
          for artifact in artifacts:
              name = artifact.get("name")
              if name not in expected:
                  continue
              if artifact.get("expired"):
                  continue
              current = selected.get(name)
              if not current or artifact.get("created_at", "") > current.get("created_at", ""):
                  selected[name] = artifact

          metadata = {
              "repository": repo,
              "selected": {},
              "missing": [],
          }

          for name, label in expected.items():
              artifact = selected.get(name)
              if not artifact:
                  metadata["missing"].append({"artifact": name, "scan": label})
                  continue

              download_url = artifact["archive_download_url"]
              req = urllib.request.Request(
                  download_url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with _opener.open(req) as response:
                  zip_bytes = response.read()

              target = out_dir / name
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(zip_bytes)) as zf:
                  zf.extractall(target)

              metadata["selected"][name] = {
                  "scan": label,
                  "id": artifact.get("id"),
                  "created_at": artifact.get("created_at"),
                  "workflow_run": artifact.get("workflow_run", {}),
              }

          pathlib.Path("reports").mkdir(parents=True, exist_ok=True)
          with open("reports/source-artifacts.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2)
          print(json.dumps(metadata, indent=2))
          PY

      - name: Install reporting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-report.txt

      - name: Build consolidated Excel workbook
        run: |
          mkdir -p reports
          python scripts/build_security_report.py \
            --artifacts-dir collected \
            --metadata-file reports/source-artifacts.json \
            --output-file reports/security-consolidated.xlsx

      - name: Upload consolidated Excel report
        uses: actions/upload-artifact@v4
        with:
          name: security-consolidated-report
          path: reports/security-consolidated.xlsx

      - name: Upload report metadata
        uses: actions/upload-artifact@v4
        with:
          name: security-consolidated-metadata
          path: reports/source-artifacts.json
