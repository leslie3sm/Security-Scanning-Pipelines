name: Security Consolidated Excel Report

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
    group: security-report-${{ github.event.pull_request.head.sha || github.sha }}
    cancel-in-progress: true

jobs:
  build-security-excel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for scanner workflows to complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["COMMIT_SHA"]

          SCANNER_WORKFLOWS = [
              "Checkov IaC Security Scan",
              "OSV Dependency Vulnerability Scan",
              "Semgrep SAST Scan",
              "Trivy Filesystem and Container Security Scan",
          ]
          TIMEOUT_SECONDS = 900  # 15 minutes
          POLL_INTERVAL = 20

          def gh_get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def get_runs_for_sha(workflow_name):
              q = urllib.parse.urlencode({"head_sha": sha, "per_page": 10})
              url = f"https://api.github.com/repos/{repo}/actions/runs?{q}"
              data = gh_get(url)
              return [
                  r for r in data.get("workflow_runs", [])
                  if r.get("name") == workflow_name
              ]

          deadline = time.time() + TIMEOUT_SECONDS
          print(f"Waiting for {len(SCANNER_WORKFLOWS)} scanner workflows on SHA {sha[:12]}...")

          while time.time() < deadline:
              pending = []
              for name in SCANNER_WORKFLOWS:
                  runs = get_runs_for_sha(name)
                  if not runs:
                      pending.append(f"{name} (not started)")
                      continue
                  latest = runs[0]
                  status = latest.get("status")
                  if status != "completed":
                      pending.append(f"{name} ({status})")

              if not pending:
                  print("All scanner workflows completed.")
                  break

              print(f"Still waiting: {pending}")
              time.sleep(POLL_INTERVAL)
          else:
              print("Timeout reached - proceeding with whatever artifacts are available.")
          PY

      - name: Download latest security artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import pathlib
          import urllib.request
          import zipfile

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["COMMIT_SHA"]
          out_dir = pathlib.Path("collected")
          out_dir.mkdir(parents=True, exist_ok=True)

          expected = {
              "checkov-iac-report": "Checkov",
              "osv-security-reports": "OSV",
              "semgrep-sast-reports": "Semgrep",
              "trivy-security-reports": "Trivy",
          }

          def gh_get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def download_artifact_zip(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return response.read()

          artifacts = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}"
              payload = gh_get(url)
              items = payload.get("artifacts", [])
              if not items:
                  break
              artifacts.extend(items)
              if len(items) < 100:
                  break
              page += 1

          selected = {}
          for artifact in artifacts:
              name = artifact.get("name")
              if name not in expected:
                  continue
              if artifact.get("expired"):
                  continue
              workflow_run = artifact.get("workflow_run", {})
              if workflow_run.get("head_sha") != sha:
                  continue
              current = selected.get(name)
              if not current or artifact.get("created_at", "") > current.get("created_at", ""):
                  selected[name] = artifact

          metadata = {
              "repository": repo,
              "selected": {},
              "missing": [],
          }

          for name, label in expected.items():
              artifact = selected.get(name)
              if not artifact:
                  metadata["missing"].append({"artifact": name, "scan": label})
                  continue

              zip_bytes = download_artifact_zip(artifact["archive_download_url"])
              if not zipfile.is_zipfile(io.BytesIO(zip_bytes)):
                  raise RuntimeError(
                      f"Artifact {name} (id={artifact.get('id')}) did not download as a zip archive."
                  )

              target = out_dir / name
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(zip_bytes)) as zf:
                  zf.extractall(target)

              metadata["selected"][name] = {
                  "scan": label,
                  "id": artifact.get("id"),
                  "created_at": artifact.get("created_at"),
                  "workflow_run": artifact.get("workflow_run", {}),
              }

          pathlib.Path("reports").mkdir(parents=True, exist_ok=True)
          with open("reports/source-artifacts.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2)
          print(json.dumps(metadata, indent=2))
          PY

      - name: Install reporting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-report.txt

      - name: Build consolidated Excel workbook
        run: |
          mkdir -p reports
          python scripts/build_security_report.py \
            --artifacts-dir collected \
            --metadata-file reports/source-artifacts.json \
            --output-file reports/security-consolidated.xlsx

      - name: Upload consolidated Excel report
        uses: actions/upload-artifact@v4
        with:
          name: security-consolidated-report
          path: reports/security-consolidated.xlsx

      - name: Upload report metadata
        uses: actions/upload-artifact@v4
        with:
          name: security-consolidated-metadata
          path: reports/source-artifacts.json
