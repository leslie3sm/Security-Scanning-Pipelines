name: OSV Dependency Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OSV Scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run OSV scan - SARIF
        run: |
          mkdir -p reports
          osv-scanner scan source -r . --format sarif > reports/osv-results.sarif
        continue-on-error: true

      - name: Run OSV scan - CycloneDX output
        run: |
          osv-scanner scan source -r . --format cyclonedx-1-5 > reports/osv-results.cdx.json
        continue-on-error: true

      - name: Upload OSV SARIF to GitHub Code Scanning
        if: ${{ hashFiles('reports/osv-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/osv-results.sarif

      - name: Upload OSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osv-security-reports
          path: reports/
          if-no-files-found: warn
